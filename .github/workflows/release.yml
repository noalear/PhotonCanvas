# Publishes a new version of PhotonCanvas as a GitHub release that the program finds, downloads and
# puts in by itself (Settings → Updates; src/PhotonCanvas.App/Updater.cs).
#
#   When      by hand only (Actions → Release → Run workflow). It used to run on every change to
#             master, but GitHub's build minutes for a private repository ran out, so new versions
#             are now published from your own computer: double-click "Publish update.cmd" in the
#             project folder (tools/publish-update.ps1), which makes the same release for free.
#             To have GitHub do it on every change again, put the push trigger back (below).
#   Version   <major.minor from Directory.Build.props>.<one past the highest v<major.minor>.* tag>,
#             e.g. 0.1.42, the same numbering as tools/publish-update.ps1, so the two never clash.
#   Builds    win-x64 unless you name others, e.g. "win-x64 osx-arm64 linux-x64".
#   Where     this repository's releases. To publish somewhere else (say a public, releases-only
#             repository), set the RELEASES_REPO variable to "owner/name" and the RELEASES_TOKEN
#             secret to a token that can write releases there. Copies built from then on update
#             from there (it's written into their update.json).
#   Checked   every change runs the full test suite before it's merged, so a release doesn't run it
#             again (it had grown past the job's time limit and was stopping releases). Tick "Run
#             the tests" to have GitHub run them too.
#   Safe      every download is listed in SHA256SUMS, and the program refuses a file that doesn't match.
#   Small     PhotonCanvas-<build>.files.txt lists every file's SHA-256, so the program downloads only
#             the files that changed, read straight out of the zip.
name: Release

# By hand only (see above). The automatic trigger it had, to put back if wanted:
#   push:
#     branches: [master]
#     paths-ignore: ['README.md', 'docs/*.md', 'requirements.txt', 'tools/RemoteProbe/**', 'src/PhotonCanvas.Remote.Android/**']
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Builds to make (win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64)'
        default: 'win-x64'
        required: false
      run_tests:
        description: 'Run the tests too (the release waits for them)'
        type: boolean
        default: false

# One build at a time. A build that has started always finishes and publishes; pushes that land
# meanwhile wait, and only the newest of them builds next. (Cancelling the running build instead
# meant that, with merges every few minutes, no build ever got to the end.)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# The tests only run when asked for by hand; then they run beside the build and the release waits for both.
jobs:
  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-test-${{ hashFiles('**/*.csproj', '**/Directory.Build.*') }}
          restore-keys: nuget-test-

      - name: Test
        run: dotnet test tests/PhotonCanvas.Tests -c Release -nologo

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-build-${{ hashFiles('**/*.csproj', '**/Directory.Build.*') }}
          restore-keys: nuget-build-

      - name: Version
        id: v
        run: |
          base=$(sed -n 's|.*<Version>\([0-9]*\.[0-9]*\)\.[0-9]*</Version>.*|\1|p' Directory.Build.props)
          base=${base:-0.1}
          last=$(git tag --list "v$base.*" | sed "s|^v$base\.||" | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "version=$base.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RELEASE_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: tools/publish.sh ${{ inputs.platforms || 'win-x64' }}

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(PhotonCanvas-*.zip PhotonCanvas-*.tar.gz)
          [ ${#files[@]} -gt 0 ] || { echo "Nothing was built."; exit 1; }
          files+=(PhotonCanvas-*.files.txt)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          retention-days: 3
          compression-level: 0
          path: |
            dist/PhotonCanvas-*.zip
            dist/PhotonCanvas-*.tar.gz
            dist/PhotonCanvas-*.files.txt
            dist/SHA256SUMS

  release:
    needs: [test, build]
    # Tests not run count as passed; a failed or cancelled test run means no release.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: |
          last=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          {
            echo "What's new in $VERSION:"
            echo
            git log --no-merges --format='- %s' ${last:+"$last..HEAD"} | head -60
            echo
            echo "PhotonCanvas downloads this version by itself and puts it in when you close it (Settings → Updates). To install it by hand, unpack the file for your computer in place of the old one: your designs, settings and material library are kept in your PhotonCanvas folder, not with the program."
            echo
            echo "PhotonCanvas is free to use, for personal or commercial work; all rights reserved. It may not be sold, redistributed or published in a modified form without written permission. The full terms are in the LICENSE file that comes with it."
          } > notes.md
          shopt -s nullglob
          files=(dist/PhotonCanvas-*.zip dist/PhotonCanvas-*.tar.gz dist/PhotonCanvas-*.files.txt dist/SHA256SUMS)
          if [ "$REPO" = "$GITHUB_REPOSITORY" ]; then
            gh release create "v$VERSION" "${files[@]}" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "PhotonCanvas $VERSION" --notes-file notes.md --latest
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
            gh release create "v$VERSION" "${files[@]}" --repo "$REPO" \
              --title "PhotonCanvas $VERSION" --notes-file notes.md --latest
          fi
          echo "Released $VERSION: https://github.com/$REPO/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
