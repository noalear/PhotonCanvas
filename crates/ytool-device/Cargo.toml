[package]
name = "ytool-device"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
futures-util = "0.3.34"
if-addrs = "0.15.0"
md-5 = "0.11.0"
native-tls = "0.2.18"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
ytool-core = { version = "0.1.0", path = "../ytool-core" }

[lints]
workspace = true
